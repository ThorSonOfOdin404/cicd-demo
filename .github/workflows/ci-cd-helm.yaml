name: 04 - Deployment to EKS cluster using Helm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "711457211649"
  ECR_REPOSITORY: attripratham/cicd-demo
  EKS_CLUSTER_NAME: cicd-repo-cluster
  K8S_NAMESPACE: default
  K8S_DEPLOYMENT: cicd-demo
  HELM_CHART_PATH: helm/cicd-demo
  HELM_RELEASE_NAME: cicd-demo
jobs:
  ci:
    name: "CI - Test, Build and Push Image"
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
      image_repository: ${{ steps.image.outputs.image_repository }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests and build application
        run: mvn --batch-mode clean verify

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GithubActionECRAccess
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE_REPOSITORY="$ECR_REGISTRY/$ECR_REPOSITORY"
          IMAGE_URI="$IMAGE_REPOSITORY:$IMAGE_TAG"
          LATEST_URI="$IMAGE_REPOSITORY:latest"

          echo "Building $IMAGE_URI"
          docker build \
            -t "$IMAGE_URI" \
            -t "$LATEST_URI" \
            .

          echo "Pushing immutable commit image..."
          docker push "$IMAGE_URI"

          echo "Pushing latest image..."
          docker push "$LATEST_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "image_repository=$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"
  cd:
    name: "CD - Deploy to EKS using Helm"
    runs-on: ubuntu-latest
    needs: ci

    steps:
      # --------------------------------------------------------
      # 1. Download repository again because the Helm chart
      #    is stored inside this repository
      # --------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Get temporary AWS credentials through OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/GithubActionECRAccess
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # 3. Configure kubectl so this GitHub runner can talk
      #    to your EKS cluster
      # --------------------------------------------------------
      - name: Configure kubectl for Amazon EKS
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # --------------------------------------------------------
      # 4. Install Helm on the GitHub runner
      # --------------------------------------------------------
      - name: Install Helm
        uses: azure/setup-helm@v4

      # --------------------------------------------------------
      # 5. Prove that GitHub Actions can reach the cluster
      # --------------------------------------------------------
      - name: Show EKS cluster connection
        run: |
          aws sts get-caller-identity
          kubectl cluster-info
          kubectl get nodes

      # --------------------------------------------------------
      # 6. Validate the Helm chart before deploying it
      # --------------------------------------------------------
      - name: Lint Helm chart
        run: |
          helm lint "$HELM_CHART_PATH"

      # --------------------------------------------------------
      # 7. Optional but excellent for a demo:
      #    show the Kubernetes YAML that Helm generates
      # --------------------------------------------------------
      - name: Preview generated Kubernetes manifests
        run: |
          helm template "$HELM_RELEASE_NAME" "$HELM_CHART_PATH" \
            --namespace "$K8S_NAMESPACE" \
            --set image.repository="${{ needs.ci.outputs.image_repository }}" \
            --set image.tag="${{ needs.ci.outputs.image_tag }}"

      # --------------------------------------------------------
      # 8. Deploy with Helm
      #
      # --install:
      #   Install if the Helm release does not already exist.
      #
      # upgrade:
      #   Update the existing release if it already exists.
      #
      # --set:
      #   Override values.yaml with the exact ECR image created
      #   by this GitHub Actions run.
      #
      # --wait:
      #   Wait for Kubernetes resources to become ready.
      #
      # --atomic:
      #   If the upgrade fails, Helm automatically rolls back
      #   the failed upgrade.
      # --------------------------------------------------------
      - name: Deploy Testbook API with Helm
        run: |
          helm upgrade --install "$HELM_RELEASE_NAME" "$HELM_CHART_PATH" \
            --namespace "$K8S_NAMESPACE" \
            --set image.repository="${{ needs.ci.outputs.image_repository }}" \
            --set image.tag="${{ needs.ci.outputs.image_tag }}" \
            --wait \
            --atomic \
            --timeout 5m

      # --------------------------------------------------------
      # 9. Show what Helm and Kubernetes deployed
      # --------------------------------------------------------
      - name: Verify Helm release
        run: |
          echo "========== HELM RELEASE =========="
          helm list --namespace "$K8S_NAMESPACE"
          
          echo "========== HELM STATUS =========="
          helm status "$HELM_RELEASE_NAME" \
            --namespace "$K8S_NAMESPACE"
          
          echo "========== DEPLOYMENTS =========="
          kubectl get deployments \
            --namespace "$K8S_NAMESPACE"
          
          echo "========== PODS =========="
          kubectl get pods \
            --namespace "$K8S_NAMESPACE" \
            -o wide
          
          echo "========== SERVICES =========="
          kubectl get services \
            --namespace "$K8S_NAMESPACE"

      # --------------------------------------------------------
      # 10. Verify Kubernetes finished rolling out the Deployment
      # --------------------------------------------------------
      - name: Verify application rollout
        run: |
          kubectl rollout status \
            deployment/testbook-api \
            --namespace "$K8S_NAMESPACE" \
            --timeout=180s