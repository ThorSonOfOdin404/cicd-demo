name: 02 - Build image, push, and deploy to EC2

on:
    push:
      branches:
        - main

    workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: attripratham/cicd-demo

jobs:

  build-and-push:

    name: Build Docker Image and Push to Amazon ECR
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::711457211649:role/GithubActionECRAccess
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    runs-on: ubuntu-latest
    needs:  build-and-push
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host : ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USERNAME}}
          key: ${{secrets.EC2_KEY}}
          script: |
            AWS_REGION="ap-south-1"
            AWS_ACCOUNT_ID="711457211649"
            ECR_REPOSITORY="attripratham/cicd-demo"
            ECR_REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
            IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
            CONTAINER_NAME="cicd-app"
            
            echo "--------------------------"
            echo "Logging EC2 into Amazon ECR..."
            echo "--------------------------"
            
            aws ecr get-login-password \
            --region $AWS_REGION \
            | docker login \
            --username AWS \
            --password-stdin $ECR_REGISTRY

            echo "--------------------------"
            echo "Pulling latest Docker image..."
            echo "--------------------------"
            
            docker pull $IMAGE
            
            echo "--------------------------"
            echo "Stopping old container..."
            echo "--------------------------"
            
            docker stop $CONTAINER_NAME || true
            docker container rm $CONTAINER_NAME || true
            
            echo "Starting new container..."

            docker run \
              -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -p 8090:8090 \
              $IMAGE
            
            echo "Getting running containers"
            docker ps
            
            echo "Application logs:"

            sleep 10

            docker logs \
              --tail 50 \
              $CONTAINER_NAME
