<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Greeting</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Inter, Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .card {
            width: min(90%, 420px);
            padding: 48px 36px;
            text-align: center;

            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #eef2ff;
            border-radius: 50%;
            font-size: 30px;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p {
            color: #6b7280;
            font-size: 16px;
            line-height: 1.6;
        }

        .name {
            color: #4f46e5;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="icon">👋</div>

    <h1>
        Hello,
        <span class="name" th:text="${name}">Guest</span>!
    </h1>

    <p>Welcome to our simple Thymeleaf page.</p>
</div>

</body>
</html>
